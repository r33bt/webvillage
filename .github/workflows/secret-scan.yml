# Fails a PR that adds a secret. Scans only the PR's new commits. PR only, no push trigger
# (ci-minutes.md rule 7): about 1 billed minute per PR push (job runs ~20 s); drafts and
# superseded runs are skipped or cancelled. Config: .gitleaks.toml at the repo root.
name: secret-scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks

      - name: Scan the PR's new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --redact keeps the value out of the log.
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" --exit-code 1
